<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Perch</title>
  <style>
    html, body { margin: 0; width: 760px; height: 580px; background: #f3ead6; }
    body { display: flex; flex-direction: column; font: 13px/1.4 -apple-system, system-ui, sans-serif; color: #2d261d; }
    .bar { display: flex; gap: 14px; align-items: center; padding: 8px 14px; background: #2d261d; color: #f3ead6; }
    .bar label { display: inline-flex; gap: 7px; align-items: center; cursor: pointer; user-select: none; }
    .brand { display: inline-flex; gap: 7px; align-items: center; font: 700 14px Georgia, serif; margin-right: 6px; }
    .brand img { width: 22px; height: 22px; }
    /* Checkboxes drawn as little switches. */
    .bar input[type=checkbox] { appearance: none; margin: 0; width: 30px; height: 17px; border-radius: 999px; background: #5a4f42; position: relative; cursor: pointer; transition: background .15s; }
    .bar input[type=checkbox]::after { content: ''; position: absolute; top: 2px; left: 2px; width: 13px; height: 13px; border-radius: 50%; background: #f3ead6; transition: transform .15s; }
    .bar input[type=checkbox]:checked { background: #e2b13c; }
    .bar input[type=checkbox]:checked::after { transform: translateX(13px); }
    .bar input:focus-visible, .bar button:focus-visible, .bar select:focus-visible { outline: 2px solid #f3ead6; outline-offset: 2px; }
    #devToggle { margin-left: auto; font: 600 12px system-ui, sans-serif; padding: 4px 10px; border-radius: 999px; border: 1px solid #6b5f50; background: none; color: #d9ccb2; cursor: pointer; }
    #devToggle[aria-expanded=true] { background: #f3ead6; color: #2d261d; border-color: #f3ead6; }
    .dev { background: #3a3228; border-top: 1px solid #4a4034; font-size: 12px; }
    .dev[hidden] { display: none; }
    .dev input[type=number] { width: 48px; font: inherit; padding: 2px 4px; border-radius: 5px; border: 0; }
    .dev select { font: inherit; padding: 3px 4px; border-radius: 5px; border: 0; max-width: 200px; }
    .dev .summon { margin-left: auto; display: inline-flex; gap: 6px; align-items: center; }
    .dev button { font: 600 12px system-ui, sans-serif; padding: 4px 12px; border-radius: 999px; border: 0; background: #e2b13c; color: #2d261d; cursor: pointer; }
    #book { flex: 1; min-height: 0; }
  </style>
</head>
<body>
  <div class="bar">
    <span class="brand"><img src="icons/icon-48.png" alt="">Perch</span>
    <label><input type="checkbox" id="enabled"> Birds on pages</label>
    <label><input type="checkbox" id="sound"> Sound</label>
    <label title="Save a small photo of each sighting. The page behind the bird is blurred and nothing leaves your computer."><input type="checkbox" id="photos"> Photos</label>
    <button id="devToggle" aria-expanded="false" aria-controls="dev">Dev tools</button>
  </div>
  <div class="bar dev" id="dev" hidden>
    <label>Arrive after <input type="number" id="idle" min="3" max="600"> s idle</label>
    <label title="Draw every edge a bird could land on (Alt+Shift+P)"><input type="checkbox" id="perches"> Show perches</label>
    <span class="summon">
      <select id="species" aria-label="Species to summon"><option value="">Random birds</option></select>
      <button id="summon">Summon on this tab</button>
    </span>
  </div>
  <div id="book"></div>
  <script type="module" src="popup.js"></script>
</body>
</html>
